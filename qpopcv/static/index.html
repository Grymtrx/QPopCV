<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QPopCV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-card">

    <!-- ── Custom title bar ───────────────────────────────────────── -->
    <div class="titlebar" id="titlebar">
      <div class="titlebar-drag" id="titlebar-drag">
        <div class="logo">
          <span class="logo-dot"></span>
          <span class="logo-text">QPopCV</span>
        </div>
        <div class="status-pill" id="status-pill" data-state="idle">
          <span class="status-orb" id="status-orb"></span>
          <span class="status-text" id="status-text">Stopped</span>
        </div>
      </div>
      <div class="titlebar-controls">
        <button class="win-btn win-btn-min" id="win-btn-min" title="Minimize">&#x2212;</button>
        <button class="win-btn win-btn-close" id="win-btn-close" title="Close">&#x2715;</button>
      </div>
    </div>

    <!-- ── Tab bar ────────────────────────────────────────────────── -->
    <nav class="tab-bar">
      <button class="tab-btn active" data-tab="discord">Discord</button>
      <button class="tab-btn" data-tab="capture">Capture</button>
      <button class="tab-btn" data-tab="images">Images</button>
      <button class="tab-btn" data-tab="afk">AFK</button>
    </nav>

    <!-- ── Discord tab ────────────────────────────────────────────── -->
    <div class="tab-panel active" id="tab-discord">
      <div class="field-row">
        <label class="field-label" for="webhook-url">Webhook</label>
        <input class="field-input" type="text" id="webhook-url"
               placeholder="https://discord.com/api/webhooks/…" autocomplete="off" spellcheck="false">
      </div>
      <div class="field-row">
        <label class="field-label" for="user-id">User ID</label>
        <input class="field-input" type="text" id="user-id"
               placeholder="17–19 digit Discord snowflake" autocomplete="off" spellcheck="false">
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" id="btn-test">Test Connection</button>
        <button class="btn btn-discord" id="btn-discord">Join Discord</button>
      </div>
    </div>

    <!-- ── Capture tab ────────────────────────────────────────────── -->
    <div class="tab-panel" id="tab-capture">
      <div class="field-row">
        <label class="field-label" for="monitor-select">Monitor</label>
        <select class="field-select" id="monitor-select"></select>
      </div>
    </div>

    <!-- ── Images tab ─────────────────────────────────────────────── -->
    <div class="tab-panel" id="tab-images">
      <div class="ref-list" id="ref-list"></div>
      <button class="btn btn-add-image" id="btn-add-image">+ Add Image</button>
    </div>

    <!-- ── AFK tab ─────────────────────────────────────────────────── -->
    <div class="tab-panel" id="tab-afk">
      <div class="check-row">
        <label class="check-label" for="afk-notify">
          <input type="checkbox" id="afk-notify" class="check-input">
          <span class="check-text">Enable AFK notification</span>
        </label>
        <p class="check-hint">Sends a Discord ping after 28 minutes to prevent Blizzard auto-logout</p>
      </div>
    </div>

    <!-- ── Footer ─────────────────────────────────────────────────── -->
    <footer class="footer">
      <div class="save-row">
        <button class="save-btn" id="btn-save">Save Configuration</button>
      </div>
      <div class="discord-warn hidden" id="discord-warn">
        <span class="discord-warn-msg">⚠ Discord is running. To receive notifications on your phone, quit Discord here or from the system tray.</span>
        <div class="discord-warn-actions">
          <button class="discord-warn-kill" id="discord-kill-btn">Kill Discord</button>
          <button class="discord-warn-continue" id="discord-continue-btn">Continue Anyway</button>
        </div>
      </div>
      <button class="watch-btn" id="watch-btn">
        <span class="watch-btn-icon">▶</span>
        <span class="watch-btn-text">Watch</span>
      </button>
      <div class="version-row">
        <span class="version-text" id="version-text">v…</span>
        <span class="update-dot">·</span>
        <span class="update-text" id="update-text">Checking…</span>
      </div>
    </footer>

  </div><!-- /.app-card -->

  <!-- ── Toast container ────────────────────────────────────────── -->
  <div class="toast-container" id="toasts"></div>

  <script src="app.js"></script>
</body>
</html>
