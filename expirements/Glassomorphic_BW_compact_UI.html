<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>QPopCV – Compact Glass Mock</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg-dark: #050505;
      --glass-dark: rgba(5, 5, 5, 0.92);
      --glass-light: rgba(255, 255, 255, 0.04);
      --border-strong: rgba(255, 255, 255, 0.3);
      --border-soft: rgba(255, 255, 255, 0.16);
      --text: #f5f5f5;
      --text-soft: #a3a3a3;

      /* Only color is status */
      --status-on: #22c55e;

      --radius-xl: 18px;
      --radius-lg: 12px;
      --radius-pill: 999px;
      --shadow-soft: 0 18px 48px rgba(0, 0, 0, 0.95);
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, #191919 0, transparent 52%),
        radial-gradient(circle at bottom right, #000000 0, #000000 65%);
    }

    .window {
      position: relative;
      width: 320px;
      max-width: 100%;
      padding: 10px 10px 9px;
      border-radius: 20px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.13), transparent 55%),
        linear-gradient(145deg, rgba(0, 0, 0, 0.98), var(--glass-dark));
      background-blend-mode: screen, normal;
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--border-strong);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
    }

    /* Title bar */
    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 6px;
    }

    .traffic-lights {
      display: flex;
      gap: 4px;
    }

    .traffic-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #3f3f3f;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.9);
    }

    .title-label {
      flex: 1;
      text-align: center;
      font-size: 10px;
      color: var(--text-soft);
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .title-spacer {
      width: 30px;
    }

    /* Card */
    .card {
      border-radius: var(--radius-xl);
      background: radial-gradient(circle at top left, var(--glass-light), var(--glass-dark));
      border: 1px solid var(--border-soft);
      padding: 9px 9px 8px;
    }

    /* Header */
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .app-id {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .logo-pill {
      width: 26px;
      height: 26px;
      border-radius: 11px;
      background:
        radial-gradient(circle at 20% 0%, #ffffff, #cfcfcf 40%, #181818 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #050505;
      font-weight: 800;
      font-size: 14px;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.95),
        0 8px 18px rgba(0, 0, 0, 0.95);
    }

    .app-text {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .app-name {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .app-sub {
      font-size: 10px;
      color: var(--text-soft);
    }

    .header-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
      font-size: 9px;
    }

    .badge-row {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .chip {
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-strong);
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.08),
        rgba(0, 0, 0, 0.95)
      );
      padding: 1px 6px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--text-soft);
    }

    .chip-status {
      color: var(--text);
    }

    .chip-dot-status {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--status-on);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.22);
    }

    .chip-label {
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    .chip-value {
      font-variant-numeric: tabular-nums;
      font-size: 9px;
    }

    /* Config area (very tight) */
    .config {
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-soft);
      background: linear-gradient(
        135deg,
        rgba(0, 0, 0, 0.96),
        rgba(22, 22, 22, 0.96)
      );
      padding: 7px 7px 6px;
      margin-bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 10px;
    }

    .config-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 4px;
    }

    .config-row.inline {
      grid-template-columns: 2fr 1fr;
      column-gap: 6px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .field-label {
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-soft);
    }

    .field-input {
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-soft);
      background: rgba(10, 10, 10, 0.98);
      padding: 4px 8px;
      font-size: 10px;
      color: var(--text);
      font-family: inherit;
      outline: none;
    }

    .field-input::placeholder {
      color: #6b6b6b;
    }

    .field-file {
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-soft);
      background: rgba(10, 10, 10, 0.98);
      padding: 4px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      cursor: default;
      font-size: 10px;
    }

    .file-label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #d4d4d4;
    }

    .file-ghost {
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-soft);
      padding: 1px 7px;
      font-size: 9px;
      color: var(--text-soft);
      background: rgba(0, 0, 0, 0.98);
    }

    /* Status rows (super minimal) */
    .rows {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 10px;
    }

    .row {
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-soft);
      background: radial-gradient(
        circle at top left,
        rgba(255, 255, 255, 0.03),
        rgba(0, 0, 0, 0.98)
      );
      padding: 6px 7px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .row-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .row-label {
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-soft);
    }

    .row-main {
      font-size: 10px;
    }

    .row-sub {
      font-size: 9px;
      color: var(--text-soft);
    }

    .row-right {
      display: flex;
      flex-direction: column;
      gap: 3px;
      align-items: flex-end;
      font-size: 9px;
    }

    .pill-btn {
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-soft);
      background: rgba(0, 0, 0, 0.98);
      color: var(--text);
      padding: 2px 7px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 9px;
      cursor: default;
    }

    .pill-btn .icon {
      font-size: 10px;
    }

    .metric-text {
      font-variant-numeric: tabular-nums;
      color: var(--text-soft);
    }

    .metric-strong {
      color: var(--text);
    }

    /* Footer */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
      padding-top: 5px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 9px;
      color: var(--text-soft);
    }

    .footer-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .status-pill {
      border-radius: var(--radius-pill);
      border: 1px solid rgba(34, 197, 94, 0.9);
      background: radial-gradient(
        circle at top,
        rgba(34, 197, 94, 0.18),
        rgba(0, 0, 0, 0.98)
      );
      padding: 2px 7px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #dcfce7;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--status-on);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.24);
    }

    .footer-right {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .link-ghost {
      text-decoration: none;
      color: #e5e5e5;
      border-bottom: 1px dashed rgba(163, 163, 163, 0.9);
      padding-bottom: 1px;
      opacity: 0.9;
      font-size: 9px;
    }

    .link-ghost:hover {
      opacity: 1;
    }

    @media (max-width: 340px) {
      .window {
        width: 100%;
      }
      .config-row.inline {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="traffic-lights">
        <div class="traffic-dot"></div>
        <div class="traffic-dot"></div>
        <div class="traffic-dot"></div>
      </div>
      <div class="title-label">QPOPCV</div>
      <div class="title-spacer"></div>
    </div>

    <div class="card">
      <!-- Header -->
      <div class="card-header">
        <div class="app-id">
          <div class="logo-pill">Q</div>
          <div class="app-text">
            <div class="app-name">QPopCV</div>
            <div class="app-sub">Solo Shuffle Watcher</div>
          </div>
        </div>
        <div class="header-meta">
          <div class="badge-row">
            <div class="chip chip-status">
              <div class="chip-dot-status"></div>
              <div class="chip-label">Status</div>
              <div class="chip-value">Watching</div>
            </div>
            <div class="chip">
              <span class="chip-label">v</span>
              <span class="chip-value">1.0.4</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Compact config -->
      <div class="config">
        <div class="config-row inline">
          <div class="field">
            <div class="field-label">Webhook</div>
            <input
              class="field-input"
              type="text"
              placeholder="https://discord.com/api/webhooks/..."
            />
          </div>
          <div class="field">
            <div class="field-label">User</div>
            <input
              class="field-input"
              type="text"
              placeholder="1234567890"
            />
          </div>
        </div>
        <div class="config-row">
          <div class="field">
            <div class="field-label">Ref Image</div>
            <div class="field-file">
              <span class="file-label">qpop_reference.png</span>
              <span class="file-ghost">Upload</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Minimal status rows -->
      <div class="rows">
        <div class="row">
          <div class="row-left">
            <div class="row-label">Queue</div>
            <div class="row-main">Solo Shuffle · 1440p</div>
            <div class="row-sub">Last pop · 12:41</div>
          </div>
          <div class="row-right">
            <div class="pill-btn">
              <span class="icon">🎯</span>
              <span>Align</span>
            </div>
            <div class="metric-text">
              Overlay <span class="metric-strong">OK</span>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="row-left">
            <div class="row-label">Discord</div>
            <div class="row-main">#qpopcv-alerts</div>
            <div class="row-sub">Last ping · 3 min</div>
          </div>
          <div class="row-right">
            <div class="pill-btn">
              <span class="icon">🔔</span>
              <span>Test</span>
            </div>
            <div class="metric-text">
              Mobile <span class="metric-strong">On</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="footer">
        <div class="footer-left">
          <div class="status-pill">
            <div class="status-dot"></div>
            <span>Watching · Main</span>
          </div>
        </div>
        <div class="footer-right">
          <a href="#" class="link-ghost">Logs</a>
          <a href="#" class="link-ghost">Discord</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
